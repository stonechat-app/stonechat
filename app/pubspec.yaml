name: zeon_chat
description: "Zeon — privacy-first messaging over your own server."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sodium: ^4.0.2
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  provider: ^6.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  uuid: ^4.5.3
  intl: ^0.20.3
  image_picker: ^1.2.3
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
