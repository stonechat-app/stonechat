name: stonechat
description: "Stonechat — privacy-first messaging over your own server."
publish_to: 'none'

version: 0.1.0+54

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.2.0
  # 10.x needs win32 ^6, which share_plus 12.x/file_picker 11.x cap at ^5 —
  # bump alongside those two (see the share_plus note below).
  package_info_plus: ^9.0.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  sqflite_sqlcipher: ^3.4.0
  local_auth: ^3.0.1
  flutter_webrtc: ^1.5.2
  path: ^1.9.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  provider: ^6.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  app_links: ^7.0.0
  uuid: ^4.5.3
  intl: ^0.20.3
  image_picker: ^1.2.3
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  video_player: ^2.11.1
  file_picker: ^11.0.2
  open_filex: ^4.7.0
  # 13.x needs win32 ^6, which file_picker 11.x caps at ^5.9 — bump together.
  share_plus: ^12.0.2
  scrollable_positioned_list: ^0.3.8
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory SQLite for DB tests (the app's SQLCipher needs its native lib).
  sqflite_common_ffi: ^2.4.0+3 # 2.4.1+ needs Dart 3.12
  flutter_launcher_icons: ^0.14.4

# Regenerate launcher icons after changing assets/icon/app_icon.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo/bird.png
    - assets/stickers/essentials/
