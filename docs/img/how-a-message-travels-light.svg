<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"
    role="img"
    aria-label="Alice asks the hub for Bob's mailbox, the hub answers with its address, Alice sends a sealed envelope to Bob's mailbox, Bob fetches it."
  >
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .t-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.22em; fill: #e04400; }
    .t-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; letter-spacing: 0.06em; fill: #7d7464; }
    .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #1a1610; letter-spacing: -0.01em; }
    .t-step { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #1a1610; letter-spacing: 0.02em; }
    .t-num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; font-weight: 700; fill: #fffdf8; }
    .box { fill: #fffdf8; stroke: #d8cfbd; stroke-width: 1.5; }
    .box--hot { stroke: #e04400; }
    .flow { fill: none; stroke: #e04400; stroke-width: 1.75; }
    .flow--reply { stroke-dasharray: 5 6; }
    @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
  </style>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0 L0 0 0 50" fill="none" stroke="rgba(26,22,16,0.05)" stroke-width="1" />
  </pattern>
  <rect width="1000" height="600" fill="#f6f1e7" />
  <rect width="1000" height="600" fill="url(#grid)" />
    <defs>
      <marker
        id="head"
        viewBox="0 0 10 10"
        refX="8"
        refY="5"
        markerWidth="7"
        markerHeight="7"
        orient="auto-start-reverse"
      >
        <path d="M0 0 L10 5 L0 10 z" fill="#e04400"></path>
      </marker>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#e04400" stop-opacity="0.18"></stop>
        <stop offset="100%" stop-color="#e04400" stop-opacity="0"></stop>
      </radialGradient>
    </defs>

    <!-- glow behind the mailbox -->
    <ellipse cx="500" cy="470" rx="220" ry="110" fill="url(#glow)"></ellipse>

    <!-- ===== HUB ===== -->
    <rect class="box" x="370" y="40" width="260" height="120"></rect>
    <text class="t-label" x="392" y="70">THE HUB</text>
    <text class="t-title" x="392" y="104">Directory</text>
    <text class="t-dim" x="392" y="136">ID → pubkey → mailbox</text>

    <!-- ===== MAILBOX ===== -->
    <rect class="box box--hot" x="370" y="410" width="260" height="130"></rect>
    <text class="t-label" x="392" y="440">BOB'S MAILBOX</text>
    <text class="t-title" x="392" y="474">Relay</text>
    <text class="t-dim" x="392" y="502">ciphertext only</text>
    <text class="t-dim" x="392" y="522">held until Bob acks</text>
    <!-- envelopes waiting -->
    <g transform="translate(560 440)">
      <rect
        x="0"
        y="0"
        width="40"
        height="28"
        fill="none"
        stroke="#e04400"
        stroke-width="1.5"></rect>
      <path
        d="M0 0 L20 16 L40 0"
        fill="none"
        stroke="#e04400"
        stroke-width="1.5"></path>
    </g>

    <!-- ===== ALICE ===== -->
    <g>
      <rect class="box" x="60" y="240" width="150" height="270" rx="24"></rect>
      <rect x="112" y="252" width="46" height="8" rx="4" fill="#d8cfbd"></rect>
      <rect x="76" y="420" width="96" height="30" rx="12" fill="#e04400"></rect>
      <text x="90" y="440" class="mono" font-size="12" fill="#fffdf8"
        >hi Bob 👋</text
      >
      <rect x="76" y="462" width="118" height="2" fill="#d8cfbd"></rect>
      <text class="t-label" x="135" y="296" text-anchor="middle">ALICE</text>
      <text class="t-dim" x="135" y="316" text-anchor="middle">device</text>
      <text class="t-dim" x="135" y="540" text-anchor="middle">SC-7Q2K-…</text>
    </g>

    <!-- ===== BOB ===== -->
    <g>
      <rect class="box" x="790" y="240" width="150" height="270" rx="24"></rect>
      <rect x="842" y="252" width="46" height="8" rx="4" fill="#d8cfbd"></rect>
      <rect
        x="806"
        y="420"
        width="96"
        height="30"
        rx="12"
        fill="none"
        stroke="#7d7464"></rect>
      <text x="820" y="440" class="mono" font-size="12" fill="#1a1610"
        >hi Bob 👋</text
      >
      <rect x="806" y="462" width="118" height="2" fill="#d8cfbd"></rect>
      <text class="t-label" x="865" y="296" text-anchor="middle">BOB</text>
      <text class="t-dim" x="865" y="316" text-anchor="middle">device</text>
      <text class="t-dim" x="865" y="540" text-anchor="middle">SC-BOB4-…</text>
    </g>

    <!-- ===== FLOWS ===== -->
    <path
      id="f1"
      class="flow"
      d="M 175 238 C 195 140, 285 85, 366 85"
      marker-end="url(#head)"></path>
    <path
      id="f2"
      class="flow flow--reply"
      d="M 368 130 C 295 135, 240 190, 205 238"
      marker-end="url(#head)"></path>
    <path
      id="f3"
      class="flow"
      d="M 214 420 C 290 420, 300 475, 366 475"
      marker-end="url(#head)"></path>
    <path
      id="f4"
      class="flow"
      d="M 634 475 C 700 475, 710 420, 786 420"
      marker-end="url(#head)"></path>

    <!-- step labels -->
    <g>
      <circle cx="40" cy="128" r="10" fill="#e04400"></circle>
      <text class="t-num" x="40" y="132" text-anchor="middle">1</text>
      <text class="t-step" x="58" y="132">add Bob:</text>
      <text class="t-dim" x="58" y="150">where is SC-BOB4-…?</text>
    </g>
    <g>
      <circle cx="300" cy="188" r="10" fill="#e04400"></circle>
      <text class="t-num" x="300" y="192" text-anchor="middle">2</text>
      <text class="t-step" x="318" y="192">pubkey +</text>
      <text class="t-step" x="318" y="210">mailbox address</text>
    </g>
    <g>
      <circle cx="236" cy="500" r="10" fill="#e04400"></circle>
      <text class="t-num" x="236" y="504" text-anchor="middle">3</text>
      <text class="t-step" x="254" y="504">sealed</text>
      <text class="t-step" x="254" y="522">envelope</text>
    </g>
    <g>
      <circle cx="664" cy="500" r="10" fill="#e04400"></circle>
      <text class="t-num" x="664" y="504" text-anchor="middle">4</text>
      <text class="t-step" x="682" y="504">fetch + ack</text>
      <text class="t-dim" x="682" y="522">then deleted</text>
    </g>

    <!-- travelling pulses, one leg at a time -->
    <g class="pulse">
      <circle r="5" fill="#ff4d00">
        <animateMotion
          dur="8s"
          repeatCount="indefinite"
          calcMode="linear"
          keyPoints="0;0;1;1"
          keyTimes="0;0.02;0.22;1"><mpath href="#f1"></mpath></animateMotion
        >
        <animate
          attributeName="opacity"
          dur="8s"
          repeatCount="indefinite"
          values="0;1;1;0;0"
          keyTimes="0;0.02;0.22;0.23;1"></animate>
      </circle>
      <circle r="5" fill="#ff4d00">
        <animateMotion
          dur="8s"
          repeatCount="indefinite"
          calcMode="linear"
          keyPoints="0;0;1;1"
          keyTimes="0;0.27;0.47;1"><mpath href="#f2"></mpath></animateMotion
        >
        <animate
          attributeName="opacity"
          dur="8s"
          repeatCount="indefinite"
          values="0;0;1;1;0;0"
          keyTimes="0;0.26;0.27;0.47;0.48;1"></animate>
      </circle>
      <circle r="5" fill="#ff4d00">
        <animateMotion
          dur="8s"
          repeatCount="indefinite"
          calcMode="linear"
          keyPoints="0;0;1;1"
          keyTimes="0;0.52;0.72;1"><mpath href="#f3"></mpath></animateMotion
        >
        <animate
          attributeName="opacity"
          dur="8s"
          repeatCount="indefinite"
          values="0;0;1;1;0;0"
          keyTimes="0;0.51;0.52;0.72;0.73;1"></animate>
      </circle>
      <circle r="5" fill="#ff4d00">
        <animateMotion
          dur="8s"
          repeatCount="indefinite"
          calcMode="linear"
          keyPoints="0;0;1;1"
          keyTimes="0;0.77;0.97;1"><mpath href="#f4"></mpath></animateMotion
        >
        <animate
          attributeName="opacity"
          dur="8s"
          repeatCount="indefinite"
          values="0;0;1;1;0;0"
          keyTimes="0;0.76;0.77;0.97;0.98;1"></animate>
      </circle>
    </g>
  </svg>