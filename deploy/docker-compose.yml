# The supported way to run the hub, for the hosted service and for anyone
# self-hosting (notes/docs/SELF_HOSTED_HUB.md). setup.sh is the older
# bare-metal path and is kept only for reference.
#
#     cp .env.example .env && $EDITOR .env
#     docker compose up -d --build
name: stonechat

services:
  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
      args:
        WITH_BILLING: ${WITH_BILLING:-1}
        WITH_GCP: ${WITH_GCP:-0}
    image: stonechat-hub:local
    restart: always
    env_file: .env
    environment:
      # Container-internal paths. Deliberately not tunable from .env — what
      # you move is the host side, via STONECHAT_STATE_DIR / STONECHAT_RELAY_DIR.
      STONECHAT_HUB_DB: /var/lib/stonechat/hub.db
      STONECHAT_RELAY_BINARY: /opt/stonechat/stonechat-relay
    ports:
      # 0.0.0.0 matches what setup.sh exposed. With Caddy terminating TLS on
      # this box, set STONECHAT_BIND=127.0.0.1 so only Caddy can reach the hub.
      - "${STONECHAT_BIND:-0.0.0.0}:${STONECHAT_HUB_PORT:-8000}:8000"
    volumes:
      # Same host path the systemd unit used, so an existing box keeps its
      # directory: stop the unit, `compose up`, same hub.db.
      - ${STONECHAT_STATE_DIR:-/var/lib/stonechat}:/var/lib/stonechat
      # Docker-over-SSH credentials for the fleet provider: the key the hub
      # authenticates to fleet hosts with, and known_hosts. Read-only, so the
      # fleet host must already be in known_hosts (`ssh-keyscan`) — ssh cannot
      # add it on first connect from in here.
      - ${STONECHAT_SSH_DIR:-/root/.ssh}:/root/.ssh:ro
      # A DIRECTORY, not the binary itself: bind-mounting a file that does not
      # exist yet silently creates a directory in its place, which reads as a
      # corrupt relay rather than a missing one.
      #
      # Defaults to the state dir because that is where the deployed hub already
      # keeps the binary (/var/lib/stonechat/stonechat-relay), so the same host
      # path is simply mounted twice — rw for the DB, ro for the relay. Point it
      # elsewhere to keep the two apart.
      - ${STONECHAT_RELAY_DIR:-/var/lib/stonechat}:/opt/stonechat:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health").read()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Push notifications: `docker compose --profile push_gateway up -d`
  # (push_gateway/main.py).
  # Off by default — without your own Apple/Firebase credentials it has
  # nothing to send with, and messages still arrive while the app is open.
  push_gateway:
    build:
      context: ../push_gateway
    image: stonechat-push-gateway:local
    profiles: [push_gateway]
    restart: always
    # No env_file on purpose: .env also carries the hub's Stripe, admin and
    # provider tokens, and the service holding the push credentials should not
    # hold those as well. It gets its own variables and nothing else.
    environment:
      STONECHAT_APNS_KEY: ${STONECHAT_APNS_KEY:-}
      STONECHAT_APNS_KEY_ID: ${STONECHAT_APNS_KEY_ID:-}
      STONECHAT_APNS_TEAM_ID: ${STONECHAT_APNS_TEAM_ID:-}
      STONECHAT_APNS_TOPIC: ${STONECHAT_APNS_TOPIC:-}
      STONECHAT_APNS_SANDBOX: ${STONECHAT_APNS_SANDBOX:-}
      STONECHAT_FCM_CREDENTIALS: ${STONECHAT_FCM_CREDENTIALS:-}
      STONECHAT_PUSH_MINT_SECRET: ${STONECHAT_PUSH_MINT_SECRET:-}
      STONECHAT_PUSH_BLOCKLIST: ${STONECHAT_PUSH_BLOCKLIST:-}
      STONECHAT_PUSH_DEBUG: ${STONECHAT_PUSH_DEBUG:-}
    ports:
      # Mailboxes run on OTHER machines and must reach this; the internet must
      # not, and ufw cannot enforce that for a published port. So publish on
      # this box's private address and let the cloud firewall keep it
      # network-internal. The loopback default reaches nothing off this box:
      # push stays silent until STONECHAT_PUSH_BIND is set, rather than open.
      - "${STONECHAT_PUSH_BIND:-127.0.0.1}:${STONECHAT_PUSH_PORT:-8100}:8100"
    volumes:
      # APNs key, FCM service account, blocklist. A directory rather than
      # single files: the blocklist is re-read when it changes, and an editor
      # that saves by writing a new file and renaming it would be invisible
      # through a single-file mount, which pins the old inode.
      - ${STONECHAT_PUSH_SECRETS_DIR:-/etc/stonechat}:/etc/stonechat:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8100/health").read()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # HTTPS, for anyone with a domain: `docker compose --profile tls up -d`.
  # Reaches the hub over the compose network as `hub:8000`, so pair it with
  # STONECHAT_BIND=127.0.0.1 and the hub is not exposed at all.
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: always
    depends_on: [hub]
    ports:
      # :80 is not optional — it is where the ACME challenge is answered, so
      # closing it breaks renewal in 60 days rather than today.
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # The issued certificates. A named volume, because losing them means
      # re-issuing into Let's Encrypt's rate limit.
      - caddy-data:/data
      - caddy-config:/config

configs:
  # Caddy fetches and renews the certificate itself — there is no certbot timer
  # to babysit. The name must already resolve to this box: issuance is proved
  # over port 80 as Caddy starts. Inline `content:` needs compose >= 2.23.1.
  #
  # The domain is filled in by compose, not Caddy: compose interpolates `$`
  # inside `content:` too, so Caddy's own `{$VAR}` form would arrive as
  # `{hub.example.com}`. Plain default, not `:?`: compose interpolates the whole
  # file before it filters profiles, so a required-variable check here would
  # fail every run that does not use tls at all. Empty is caught by Caddy.
  caddyfile:
    content: |
      ${STONECHAT_HUB_DOMAIN:-} {
        reverse_proxy hub:8000
      }

volumes:
  caddy-data:
  caddy-config:
