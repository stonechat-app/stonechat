# App Store listing copy — en-US.
#
# Pushed to App Store Connect by scripts/appstore_listing.py. This file is the
# source of truth: edit here, not in the ASC web UI, or the next push overwrites
# your edit. Apple's length limits are enforced by the script before anything is
# sent, so a too-long subtitle fails locally instead of halfway through a push.
#
# Every privacy claim below has to stay true of landing/src/pages/privacy.astro
# and of the code. If one stops being true, all three change together.

locale = "en-US"

[app_info]
# Shown on the product page regardless of which version is live.
name     = "Stonechat - private messenger"   # <= 30
subtitle = "Your server. Your messages."    # <= 30

privacy_policy_url = "https://stonechat.app/privacy"

primary_category   = "SOCIAL_NETWORKING"
secondary_category = "UTILITIES"

[version]
# Per-version copy, attached to whichever version is editable.
support_url   = "https://stonechat.app/support"
marketing_url = "https://stonechat.app"

# <= 170. Changeable without submitting a build — the one field you can edit
# to react to press or a launch moment.
promotional_text = """
Every user has their own server. Messages are end-to-end encrypted, deleted from the relay once your phone has them, and kept only on your device."""

# <= 100 total, comma-separated. Words already in the app name ("private",
# "messenger") are indexed from the name — spending keyword bytes on them again
# is wasted, so this list deliberately avoids them.
keywords = "encrypted,e2ee,secure,self-hosted,sovereign,privacy,no phone number,anonymous,server,relay"

# <= 4000.
description = """
Stonechat is a messenger where every user has their own server.

There is no central message store to subpoena, breach, or mine. Your "relay" is a small server that is yours alone. Its only job is to hold end-to-end encrypted envelopes until your phone picks them up. Then they are deleted.

INVITE-ONLY FOR NOW
With an invite code, the app sets up a hosted relay for you in the country you choose. Without one, you can point the app at a relay you run yourself, or join one that a friend hosts for you.

NO PHONE NUMBER. NO EMAIL.
Your identity is a cryptographic keypair generated on your device the first time you open the app. Your Stonechat ID reveals nothing about you — share it by QR code or as plain text. There is no directory of users to search, and no way for strangers to find you.

ENCRYPTION THAT DOESN'T ASK FOR TRUST
PQXDH key agreement and a double ratchet — the same construction Signal uses — with prekeys served by your own relay instead of a company's. Every message gets a fresh key. Keys stolen today cannot decrypt traffic recorded yesterday, and the key agreement is hybrid post-quantum (ML-KEM-768): messages recorded now stay sealed against future quantum computers.

GROUPS WITHOUT A GROUP SERVER
A group is not stored anywhere. Each message goes, separately encrypted, to each member's own relay, and no server ever holds the member list.

YOUR HISTORY LIVES ON YOUR PHONE
Your message history is kept in an encrypted database on your device and nowhere else. Delivered envelopes are deleted from the relay as soon as your phone confirms it has them. Uninstall the app and your history is genuinely gone — there is no cloud copy, because there is no cloud.

PINNED TLS, NO CERTIFICATE AUTHORITIES
Relays sign their own certificates. Your app pins a fingerprint that the relay's owner signed with their identity key. Trust chains to a person's key, not to an authority you have never met.

HOST YOUR CIRCLE
If you run your own relay host, you can invite friends and family and give each of them their own isolated mailbox on it. You host the metal; you never host the meaning — their messages stay end-to-end encrypted, including from you.

RUN YOUR OWN
The relay is one small program with one job. Run it on your own hardware and still talk to everyone on the network."""

# While the first version is invite-only, nothing here may mention prices,
# plans, purchases or subscriptions: an invite code that reads like a way
# around in-app purchase is what gets such an app rejected.

# NOTE: the previous "OPEN SOURCE — read every line" section comes back the
# day the repo actually flips public. Until then the claim would be false and
# App Review checks.

# <= 4000. Only meaningful on an update; Apple rejects it on a first version,
# so the script skips it while the app has never been released.
whats_new = ""

# Where the app is offered, and for how much. The first version is free.
#
# France stays out: the export-compliance answers given to Apple say the app is
# not distributed there (app/ios/Runner/Info.plist). Adding it back means a
# French encryption declaration first, then redoing that questionnaire.
[availability]
base_territory = "USA"
excluded = ["FRA"]

# What App Review reads. {invite_codes} and {test_contact} are filled in from
# .env.appstore, as is the contact Apple may phone — none of it belongs in a
# public repository. Invite codes work once each, so give several: a reviewer
# who reinstalls, or tests on a second device, needs another.
[review]
notes = """
Stonechat is a messenger in which every user has their own server (a "mailbox"). This first version is invite-only. Nothing is sold in the app or on the web: there are no purchases and no subscriptions. An invite code is given out by the developer, free of charge, and only tells our service to set up a hosted mailbox for that user.

TO USE THE APP

1. Open the app, type any display name and tap "Create account". The identity is a key generated on the device — there is no email, phone number or password, so there is no demo account to give you. The next screen shows your Stonechat ID; tap "Continue".

2. On "Where should your mailbox live?", choose "Stonechat Cloud", pick any country and tap "Set up my mailbox". The app asks for an invite code. Enter one of these and tap "Unlock" (each works once; several are provided in case you reinstall or use more than one device):

{invite_codes}

   Setting up takes about two minutes. Then tap "Start chatting".

3. To have someone to message: tap "Add a friend", paste this Stonechat code and tap "Send request":

    {test_contact}

   It is an automated test account ("tundra (echo bot)") that accepts the request at once and replies to every message. You can also create a group ("New group") and add it.

USER-GENERATED CONTENT

Messages are end-to-end encrypted, so we cannot see or filter them. A person can only be contacted by someone who already has their Stonechat ID; there is no directory and no search. Anyone can be blocked (Settings > Blocked people, or from a message or a group's member list) and reported ("Report" in a chat's menu, a conversation's menu, or a group member's menu). A report reaches us with the messages the reporter chooses to include.

ENCRYPTION

The app uses standard algorithms (X25519, Ed25519, ML-KEM-768, XChaCha20-Poly1305, BLAKE2) and is not distributed in France.
"""

# Apple derives the displayed age rating from these answers. An unmoderated
# end-to-end encrypted messenger genuinely carries user-generated content we
# cannot inspect — answering otherwise would be a lie that App Review is
# specifically good at catching.
#
# Apple treats this as one questionnaire: every attribute must be sent in the
# same request, so the script always PATCHes the whole block rather than a diff.
# Some fields are booleans and some are NONE/INFREQUENT_OR_MILD/FREQUENT_OR_INTENSE
# enums; the split below is what the API actually accepts, not a guess.
[age_rating]
# booleans
messagingAndChat      = true    # it is a messenger
userGeneratedContent  = true    # E2EE means we cannot moderate it, by design
unrestrictedWebAccess = false
advertising           = false
gambling              = false
lootBox               = false
parentalControls      = false
healthOrWellnessTopics = false
ageAssurance          = false

# frequency enums
violenceCartoonOrFantasy                    = "NONE"
violenceRealistic                           = "NONE"
violenceRealisticProlongedGraphicOrSadistic = "NONE"
gunsOrOtherWeapons                          = "NONE"
profanityOrCrudeHumor                       = "NONE"
sexualContentOrNudity                       = "NONE"
sexualContentGraphicAndNudity               = "NONE"
alcoholTobaccoOrDrugUseOrReferences         = "NONE"
horrorOrFearThemes                          = "NONE"
matureOrSuggestiveThemes                    = "NONE"
gamblingSimulated                           = "NONE"
medicalOrTreatmentInformation               = "NONE"
contests                                    = "NONE"
